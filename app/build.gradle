plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qianxian.JetourWallpaper'
    compileSdk 34

    defaultConfig {
        applicationId "com.qianxian.JetourWallpaper"
        minSdk 26
        targetSdk 34
        versionCode 300
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 不在 gradle 内签名，构建 unsigned release 后用 apksigner
            // 以 platform.pk8 + platform.x509.pem 完成平台签名
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 统一打包文件名格式：应用名_v版本_build版本号_构建类型.apk
    // 例：捷途动态壁纸_v3.0_build300_release-unsigned.apk / _debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "捷途动态壁纸"
            def version = variant.versionName
            def buildCode = variant.versionCode
            def type = variant.buildType.name
            def suffix = type == "release" ? "release-unsigned" : type
            outputFileName = "${appName}_v${version}_build${buildCode}_${suffix}.apk"
        }
    }
}

dependencies {
}
