plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qianxian.JetourWallpaper'
    compileSdk 34

    defaultConfig {
        applicationId "com.qianxian.JetourWallpaper"
        minSdk 26
        targetSdk 34
        versionCode 103
        versionName "1.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 不在 gradle 内签名，构建 unsigned release 后用 apksigner
            // 以 platform.pk8 + platform.x509.pem 完成平台签名
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 统一打包文件名格式：应用名_版本号_日期_AOSP-Platform.apk
    // 例：JetourLivewallpaper_3.0_20261111_AOSP-Platform.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "JetourLivewallpaper"
            def version = variant.versionName
            def date = new Date().format("yyyyMMdd")
            outputFileName = "${appName}_${version}_${date}_AOSP-Platform.apk"
        }
    }
}

dependencies {
}
